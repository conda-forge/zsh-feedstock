conda_build:
  pkg_format: '2'
conda_build_tool: rattler-build
conda_install_tool: pixi
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_64: default
  linux_aarch64: default
  linux_ppc64le: native # needed as otherwise QEMU emulation fails on A01grammar, B01cd and E03posix tests
  linux_riscv64: default
  osx_64: default
  osx_arm64: default
test: native_and_emulated
